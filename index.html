<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alguien Especial ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        h1 { color: #d63384; }
        .contador {
            font-size: 24px;
            font-weight: bold;
            color: #b11d5c;
            margin-top: 20px;
        }
        .btn-sorpresa {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 30px;
        }
        .btn-sorpresa:hover { background-color: #b11d5c; }
    </style>
</head>
<body>

    <h1>❤️ Para la chica más increíble del mundo 'Siomara' ❤️</h1>
    <p>Si las mariposas hablaran, dirían que eres la más hermosa que hasta la primavera necesita de ti para florecer.</p>
    
    <div class="contador" id="reloj">Cargando contador...</div>

    <button class="btn-sorpresa" onclick="mostrarSorpresa()">¡Haz clic para una sorpresa!</button>

    <script>
        // Configura tu fecha especial aquí (Año, Mes [0-11], Día, Hora, Minuto)
        // Nota: Enero es 0, Febrero es 1, etc.
        const fechaInicio = new Date(2024, 1, 14, 0, 0, 0); 

        function actualizarContador() {
            const ahora = new Date();
            const diferencia = ahora - fechaInicio;

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById('reloj').innerHTML = 
                `Mi cariño por ti comenzó hace:<br>${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos`;
        }

        setInterval(actualizarContador, 1000);

        function mostrarSorpresa() {
            alert("¡Feliz cumpleaños, Siomara! 🎈🎉");
            // Aquí puedes añadir código para lanzar confeti o efectos visuales
        }
    </script>
</body>
</html>
